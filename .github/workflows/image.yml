# Builds the app image for amd64 and arm64 and publishes it to GHCR
# (ghcr.io/juniorcarlini/hangar-lab), the "Docker image" way to deploy it.
name: image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/juniorcarlini/hangar-lab:latest
            ghcr.io/juniorcarlini/hangar-lab:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/JuniorCarlini/hangar-lab
            org.opencontainers.image.description=Hangar lab app: Django + Celery + PostgreSQL + Redis
          cache-from: type=gha
          cache-to: type=gha,mode=max
